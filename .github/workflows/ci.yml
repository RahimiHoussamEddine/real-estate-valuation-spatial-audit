name: quality-and-container

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m venv .venv && make install-dev
      - name: Build the pinned source report
        run: make fetch build
      - name: Validate artifacts and code
        run: make verify test quality check-deps
      - name: Build container
        run: docker build -t real-estate-valuation-spatial-audit .
      - name: Check API in container
        run: |
          docker run --detach --rm --name real-estate-audit -p 8000:8000 real-estate-valuation-spatial-audit
          if ! curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 25 http://127.0.0.1:8000/health; then
            docker logs real-estate-audit
            exit 1
          fi
          docker stop real-estate-audit
